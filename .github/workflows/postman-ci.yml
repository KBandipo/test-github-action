name: Run Postman API Tests

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - master

jobs:
  run-api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Run Postman Collection via CLI
        run: npx postman-cli collection run "3a667fee-7dd2-4b1b-8240-84cc9352d39c"
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
